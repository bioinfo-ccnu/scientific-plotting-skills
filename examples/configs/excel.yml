version: 1
backend: python
synthetic: true
presets:
- minimal
output: ../../build/recipes/excel
width_mm: 150
height_mm: 100
dpi: 300
title: SYNTHETIC DATA | explicit paired comparison
panels:
- type: paired
  data: ../../skills/scientific-plotting/assets/templates/paired-wide.xlsx
  sheet: Measurements
  reshape:
    mode: long
    id_columns:
    - subject
    value_columns:
    - A
    - B
    names_to: group
    values_to: value
  statistics:
    method: paired-t
    experimental_unit: independent synthetic subject
    contrasts:
    - - A
      - B
    confidence: 0.95
    adjust: bh
