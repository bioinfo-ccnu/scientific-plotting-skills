version: 1
backend: python
synthetic: true
presets:
- nature
- dark
output: ../../build/recipes/general
width_mm: 260
height_mm: 220
dpi: 180
formats:
- pdf
- svg
- png
title: GENERAL | SYNTHETIC DATA
layout:
  ncols: 3
  tags: true
panels:
- type: raincloud
  data: ../../skills/scientific-plotting/assets/templates/raincloud.csv
  options:
    title: Raincloud
- type: paired
  data: ../../skills/scientific-plotting/assets/templates/paired.csv
  options:
    title: Paired
- type: ribbon
  data: ../../skills/scientific-plotting/assets/templates/ribbon.csv
  options:
    title: Ribbon
    interval_definition: "synthetic supplied \xB10.06 interval; not inferred CI"
- type: forest
  data: ../../skills/scientific-plotting/assets/templates/forest.csv
  options:
    title: Forest
    interval_definition: synthetic supplied interval; not inferred CI
- type: correlation
  data: ../../skills/scientific-plotting/assets/templates/correlation.csv
  options:
    title: Correlation
- type: facet
  data: ../../skills/scientific-plotting/assets/templates/facet.csv
  options:
    title: Facet
